        },
        {
          "type": "row",
          "title": "Microsserviços — taxa, erros e latência (OpenTelemetry)",
          "id": 8,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
