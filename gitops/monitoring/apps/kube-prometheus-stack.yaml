# Helm chart kube-prometheus-stack 92.11.0 (values em gitops/monitoring/values/kube-prometheus-stack.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: togglemaster-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.11.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/monitoring/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/Maic2018/tech_challenge_3.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs do Prometheus Operator passam do limite de tamanho do client-side apply
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
