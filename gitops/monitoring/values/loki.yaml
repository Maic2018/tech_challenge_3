# Loki (chart grafana/loki) em modo SingleBinary: 1 pod com todos os componentes,
# armazenamento em filesystem (emptyDir). O cluster não tem o EBS CSI driver, então
# não há PVC: os logs ficam retidos enquanto o pod existir (suficiente para o lab).
# Os logs chegam pelo OTel Collector gateway via OTLP nativo (/otlp/v1/logs).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 72h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Atributos de recurso OTLP promovidos a label (além dos padrões do Loki:
  # service_name, k8s_namespace_name, k8s_deployment_name, k8s_container_name...)
  distributor:
    otlp_config:
      default_resource_attributes_as_index_labels:
        - service.name
        - service.namespace
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.daemonset.name
        - k8s.statefulset.name
        - k8s.container.name
        - k8s.cluster.name

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: storage
      emptyDir: {}
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

# Modo SingleBinary: os demais alvos ficam zerados
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Sem gateway nginx: Grafana e OTel falam direto com o Service "loki:3100"
gateway:
  enabled: false

# Caches memcached pedem GBs de memória por padrão; desnecessários neste volume
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
