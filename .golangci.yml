# golangci-lint v2 — linter dos serviços Go (job "Linter / Static Analysis").
version: "2"
linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
formatters:
  enable:
    - gofmt
