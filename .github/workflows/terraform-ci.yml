# Valida a infraestrutura como código: formatação, init/validate dos dois root
# modules e scan de misconfigurações (Trivy config, informativo).
name: terraform-ci

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform-ci.yml"]
  workflow_dispatch:

env:
  TRIVY_VERSION: "0.74.0"

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra, infra/platform]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
      - name: terraform fmt -check
        run: terraform -chdir=${{ matrix.dir }} fmt -check -recursive -diff
      - name: terraform init (sem backend)
        run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=${{ matrix.dir }} validate

  iac-security:
    name: IaC security scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O setup-trivy da action oficial resolve o download pela API do GitHub e
      # esbarra em rate limit nos runners. Baixamos o binario direto do asset da
      # release (URL fixa, sem API), o que torna o pipeline deterministico.
      - name: Instalar Trivy
        run: |
          URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --show-error --location --silent -o /tmp/trivy.tar.gz "$URL"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy config (misconfigurações no Terraform, informativo)
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 0 --format table infra
