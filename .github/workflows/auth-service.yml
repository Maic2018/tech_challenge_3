# CI + DevSecOps do auth-service. Roda em todo Pull Request e push na main que toque
# neste serviço. A lógica está no workflow reutilizável _service-ci.yml.
name: auth-service

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/_service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/_service-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-auth-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: auth-service
      language: go
    secrets: inherit
