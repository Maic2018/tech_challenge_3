# CI + DevSecOps do evaluation-service. Roda em todo Pull Request e push na main que toque
# neste serviço. A lógica está no workflow reutilizável _service-ci.yml.
name: evaluation-service

on:
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
      - ".github/workflows/_service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
      - ".github/workflows/_service-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-evaluation-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: evaluation-service
      language: go
    secrets: inherit
