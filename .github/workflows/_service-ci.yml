# ─────────────────────────────────────────────────────────────────────────────
# Pipeline reutilizável de CI + DevSecOps de um microsserviço do ToggleMaster.
# Chamado pelos 5 workflows <serviço>.yml. Estágios (jobs), na ordem do enunciado:
#   1. Build & Unit Test
#   2. Linter / Static Analysis
#   3. Security Scan (SCA + SAST) — REGRA DE BLOQUEIO: CRITICAL derruba o pipeline
#   4. Docker Build -> Container Scan (Trivy) -> Login ECR -> Push com tag do commit
#   5. GitOps: atualiza a tag da imagem em gitops/apps/<serviço>/deployment.yaml
# ─────────────────────────────────────────────────────────────────────────────
name: service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Pasta do microsserviço (ex. auth-service)
        required: true
        type: string
      language:
        description: go | python
        required: true
        type: string

env:
  APP_VERSION: "1.0.0"
  AWS_REGION: us-east-1
  ECR_NAMESPACE: togglemaster
  # Espelhos do banco de vulnerabilidades do Trivy (evita rate limit do ghcr.io)
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

permissions:
  contents: read

jobs:
  # ───────────────────────── 1. Build & Unit Test ─────────────────────────
  build-test:
    name: 1. Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      # --- Go ---
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum
      - name: Build (go build)
        if: inputs.language == 'go'
        run: |
          go mod verify
          go build -v ./...
      - name: Unit tests (go test)
        if: inputs.language == 'go'
        run: go test -v -race -cover ./...

      # --- Python ---
      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.service }}/requirements.txt
      - name: Build (instala dependências e compila o bytecode)
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q .
      - name: Unit tests (pytest, se houver)
        if: inputs.language == 'python'
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q
          else
            echo "Sem testes unitários neste serviço (enunciado: 'se houver')."
          fi

  # ───────────────────────── 2. Linter / Static Analysis ──────────────────
  lint:
    name: 2. Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum
      - name: golangci-lint
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ${{ inputs.service }}

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: flake8
        if: inputs.language == 'python'
        run: |
          pip install flake8
          flake8 --config .flake8 ${{ inputs.service }}

  # ───────────────────────── 3. Security Scan (SCA + SAST) ────────────────
  security-scan:
    name: 3. Security Scan (SCA + SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SCA: vulnerabilidades nas dependências (go.mod/go.sum, requirements.txt)
      # e segredos hardcoded. REGRA DE BLOQUEIO: qualquer CRITICAL falha aqui.
      - name: SCA - Trivy fs (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service }}
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: SCA - relatório HIGH/CRITICAL (informativo)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: table

      # SAST: vulnerabilidades no código-fonte (gosec para Go, bandit para Python).
      # Roda mesmo se o SCA falhou, para o relatório ficar completo.
      - name: Setup Go
        if: always() && inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum
      - name: SAST - gosec (Go)
        if: always() && inputs.language == 'go'
        working-directory: ${{ inputs.service }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "::group::Relatório completo do gosec (informativo)"
          gosec -no-fail -fmt text ./... || true
          echo "::endgroup::"
          echo "Regra de bloqueio: achados de severidade HIGH derrubam o pipeline"
          gosec -severity high -confidence medium -fmt text ./...

      - name: Setup Python
        if: always() && inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SAST - bandit (Python)
        if: always() && inputs.language == 'python'
        working-directory: ${{ inputs.service }}
        run: |
          pip install bandit
          echo "::group::Relatório completo do bandit (informativo)"
          bandit -r . -x ./tests --exit-zero
          echo "::endgroup::"
          echo "Regra de bloqueio: severidade e confiança >= MEDIUM derrubam o pipeline"
          bandit -r . -x ./tests -ll -ii

  # ───────────────────────── 4. Docker Build & Push ───────────────────────
  docker-build-push:
    name: 4. Docker Build, Container Scan & Push (ECR)
    needs: [build-test, lint, security-scan]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Define a tag da imagem (v<versão>-<hash do commit>)
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${APP_VERSION}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "local_image=${ECR_NAMESPACE}/${{ inputs.service }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker build
        run: docker build --pull -t "${{ steps.meta.outputs.local_image }}" "${{ inputs.service }}"

      # Container Scan: SO + bibliotecas dentro da imagem. Bloqueia em CRITICAL.
      - name: Container Scan - Trivy image (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.local_image }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      # Em Pull Request só validamos build + scan. Push só em push/dispatch.
      # AWS Academy não permite criar roles OIDC, por isso usamos access keys em Secrets
      # (scripts/set-github-secrets.sh renova a cada sessão do laboratório).
      - name: Configurar credenciais AWS
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push para o ECR
        if: github.event_name != 'pull_request'
        id: push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_NAMESPACE}/${{ inputs.service }}:${{ steps.meta.outputs.tag }}"
          docker tag "${{ steps.meta.outputs.local_image }}" "$IMAGE"
          docker push "$IMAGE"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Imagem publicada no ECR"
            echo '`'"${IMAGE}"'`'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────── 5. GitOps ────────────────────────────────────
  update-gitops:
    name: 5. GitOps - atualizar tag da imagem
    needs: docker-build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Os 5 pipelines podem terminar juntos: serializa os commits no repositório GitOps.
    concurrency:
      group: gitops-update-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # GITHUB_TOKEN basta se a branch não for protegida; caso contrário crie o
          # secret GITOPS_TOKEN (PAT com permissão de escrita em contents).
          token: ${{ secrets.GITOPS_TOKEN != '' && secrets.GITOPS_TOKEN || github.token }}

      - name: Atualiza deployment.yaml com a nova tag e faz commit
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ needs.docker-build-push.outputs.image }}
          TAG: ${{ needs.docker-build-push.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "togglemaster-ci[bot]"
          git config user.email "ci@togglemaster.local"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            bash scripts/update-image-tag.sh "$SERVICE" "$IMAGE"
            if git diff --quiet; then
              echo "Manifesto já aponta para $IMAGE. Nada a fazer."
              exit 0
            fi
            git add gitops
            git commit -m "ci(gitops): ${SERVICE} -> ${TAG} [skip ci]" \
                       -m "Imagem: ${IMAGE}" \
                       -m "Commit de origem: ${GITHUB_SHA}"
            if git push origin "HEAD:${BRANCH}"; then
              {
                echo "### GitOps atualizado"
                echo "gitops/apps/${SERVICE}/deployment.yaml -> ${IMAGE}"
                echo "O ArgoCD detecta o commit e sincroniza o cluster automaticamente."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push falhou (tentativa ${attempt}): outro pipeline commitou antes. Tentando de novo..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "Não foi possível atualizar o repositório GitOps após 5 tentativas."
          exit 1
