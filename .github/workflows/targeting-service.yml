# CI + DevSecOps do targeting-service. Roda em todo Pull Request e push na main que toque
# neste serviço. A lógica está no workflow reutilizável _service-ci.yml.
name: targeting-service

on:
  push:
    branches: [main]
    paths:
      - "targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_service-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-targeting-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: targeting-service
      language: python
    secrets: inherit
